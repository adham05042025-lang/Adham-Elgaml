<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Adham Elgaml</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
    
    <!-- ====== SIDEBAR ====== -->
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-spider"></i>
            <span>Dashboard</span>
        </div>
        
        <!-- Profile -->
        <div class="profile-section">
            <div class="profile-avatar">
                <img src="assets/images/adham.jpg" alt="Adham Elgaml" />
                <div class="online-status"></div>
            </div>
            <h3 class="profile-name">Adham Elgaml</h3>
            <p class="profile-title">🎬 Video Editor</p>
        </div>
        
        <!-- Categories -->
        <nav class="categories">
            <button class="category-btn active" data-category="all">
                <i class="fas fa-th-large"></i> All Videos
            </button>
            <button class="category-btn" data-category="reel">
                <i class="fas fa-video"></i> Reel
            </button>
            <button class="category-btn" data-category="film">
                <i class="fas fa-film"></i> Film
            </button>
            <button class="category-btn" data-category="ai">
                <i class="fas fa-robot"></i> AI
            </button>
            <button class="category-btn" data-category="motion">
                <i class="fas fa-magic"></i> Motion
            </button>
            <button class="category-btn" data-category="wedding">
                <i class="fas fa-ring"></i> Wedding
            </button>
        </nav>
        
        <button class="add-btn" id="openAddModal">
            <i class="fas fa-plus-circle"></i> Add New Video
        </button>
        
        <a href="index.html" class="view-site-btn">
            <i class="fas fa-external-link-alt"></i> View Portfolio
        </a>
    </aside>
    
    <!-- ====== MAIN CONTENT ====== -->
    <main class="main-content">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>🎬 Video Manager</h1>
            <div class="header-actions">
                <span class="video-count" id="videoCount">0 videos</span>
                <button class="search-btn" id="searchToggle"><i class="fas fa-search"></i></button>
            </div>
        </header>
        
        <!-- Search Bar -->
        <div class="search-bar" id="searchBar">
            <input type="text" id="searchInput" placeholder="🔍 Search videos..." />
            <button id="clearSearch"><i class="fas fa-times"></i></button>
        </div>
        
        <!-- Videos Grid -->
        <section class="videos-grid" id="videosGrid"></section>
    </main>
    
    <!-- ====== ADD VIDEO MODAL ====== -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> Add New Video</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="addVideoForm">
                <div class="form-group">
                    <label>Video Title</label>
                    <input type="text" id="addTitle" placeholder="e.g. Cinematic Reel - Action" required />
                </div>
                <div class="form-group">
                    <label>Video URL (Vimeo / YouTube)</label>
                    <input type="url" id="addUrl" placeholder="https://vimeo.com/..." required />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="addCategory" required>
                        <option value="">Select Category</option>
                        <option value="reel">🎬 Reel</option>
                        <option value="film">🎥 Film</option>
                        <option value="ai">🤖 AI</option>
                        <option value="motion">✨ Motion</option>
                        <option value="wedding">💍 Wedding</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="addDescription" placeholder="Brief description..."></textarea>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-save"></i> Save Video
                </button>
            </form>
        </div>
    </div>
    
    <!-- ====== EDIT VIDEO MODAL ====== -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Edit Video</h2>
                <button class="close-modal" id="closeEditModal">&times;</button>
            </div>
            <form id="editVideoForm">
                <input type="hidden" id="editId" />
                <div class="form-group">
                    <label>Video Title</label>
                    <input type="text" id="editTitle" required />
                </div>
                <div class="form-group">
                    <label>Video URL</label>
                    <input type="url" id="editUrl" required />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="editCategory" required>
                        <option value="reel">🎬 Reel</option>
                        <option value="film">🎥 Film</option>
                        <option value="ai">🤖 AI</option>
                        <option value="motion">✨ Motion</option>
                        <option value="wedding">💍 Wedding</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editDescription"></textarea>
                </div>
                <button type="submit" class="submit-btn">
                    <i class="fas fa-save"></i> Update Video
                </button>
            </form>
        </div>
    </div>
    
    <!-- ====== VIDEO PLAY MODAL ====== -->
    <div class="modal" id="videoModal">
        <div class="modal-content video-modal-content">
            <div class="modal-header">
                <h2 id="videoModalTitle">Watch Video</h2>
                <button class="close-modal" id="closeVideoModal">&times;</button>
            </div>
            <div class="video-container">
                <iframe id="videoIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    
    <script src="dashboard.js"></script>
</body>
</html>
